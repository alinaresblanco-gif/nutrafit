<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NUTRAFIT - Mi Asistente</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    
    <link rel="manifest" href="manifest.json">
    
    <meta name="theme-color" content="#78a978">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NutraFit">

    <link rel="apple-touch-icon" href="IMAGENES/logo.png">
    <link rel="icon" type="image/png" href="IMAGENES/logo.png">

    <style>
        .toast-actualizacion {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%) translateY(20px);
            background: rgba(46, 74, 46, 0.95);
            color: #fff;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.2px;
            z-index: 9999;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
            max-width: calc(100% - 30px);
            text-align: center;
        }

        .toast-actualizacion.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast-actualizacion.info {
            background: rgba(46, 74, 46, 0.95);
        }

        .toast-actualizacion.ok {
            background: rgba(90, 138, 90, 0.96);
        }
    </style>
</head>
<body>
    <!-- MODAL DE LOGIN/REGISTRO/BIENVENIDA -->
    <div id="modal-usuario" class="modal-usuario oculto">
        <div class="modal-usuario-contenido">
            <h2 id="modal-usuario-titulo">Bienvenida a Nutrafit</h2>
            <div id="modal-usuario-formulario">
                <input type="email" id="input-correo" placeholder="Correo electrónico" autocomplete="email" required>
                <input type="text" id="input-nombre" placeholder="Nombre" autocomplete="name" required>
                <button id="btn-registrar-usuario">Registrarme</button>
                <button id="btn-login-usuario">Ya tengo cuenta</button>
            </div>
            <div id="modal-usuario-mensaje" class="modal-usuario-mensaje"></div>
        </div>
    </div>

    <div id="pantalla-inicio" class="contenedor">
        <header class="cabecera-inicio">
            <img src="IMAGENES/IMAGEN_2.png" class="imagen-principal" alt="Nutrafit Logo">
        </header>
        
        <div class="menu">
            <button onclick="abrirVista('creditos-diarios')">
                <i class="fas fa-credit-card"></i> Mis Créditos Diarios
            </button>
            
            <button onclick="abrirVista('creditos-alimentos')">
                <i class="fas fa-apple-alt"></i> Mis Créditos de Alimentos
            </button>
            
            <button onclick="abrirVista('evolucion-peso')">
                <i class="fas fa-chart-line"></i> Mi Evolución de Peso
            </button>
            
            <button onclick="abrirVista('agua')">
                <i class="fas fa-glass-whiskey"></i> Mi Control de Agua
            </button>
            
            <button onclick="abrirVista('diario-formulario')">
                <i class="fas fa-book-open"></i> Mi Diario de Comida
            </button>
            
            <button onclick="abrirVista('carrito-compra')">
                <i class="fas fa-shopping-cart"></i> Mi Carrito de la Compra
            </button>
            
            <button onclick="abrirVista('recetas-favoritas')">
                <i class="fas fa-heart"></i> Mis Recetas Favoritas
            </button>
            
            <button onclick="abrirVista('ejercicio-diario')">
                <i class="fas fa-dumbbell"></i> Mi Ejercicio Diario
            </button>
        </div>
    </div>

    <div id="contenedor-vistas" style="display: none; min-height: 100vh; width: 100%;">
        </div>

    <div id="toast-actualizacion" class="toast-actualizacion info" aria-live="polite"></div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <script src="js/app.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const toast = document.getElementById('toast-actualizacion');
                let temporizadorToast = null;

                function mostrarToastActualizacion(mensaje, tipo = 'info', autocierreMs = 0) {
                    if (!toast) return;
                    toast.textContent = mensaje;
                    toast.classList.remove('info', 'ok');
                    toast.classList.add(tipo);
                    toast.classList.add('visible');

                    if (temporizadorToast) {
                        clearTimeout(temporizadorToast);
                        temporizadorToast = null;
                    }

                    if (autocierreMs > 0) {
                        temporizadorToast = setTimeout(() => {
                            toast.classList.remove('visible');
                        }, autocierreMs);
                    }
                }

                navigator.serviceWorker.register('./sw.js')
                    .then(reg => {
                        console.log('Service Worker activo');

                        if (reg.waiting) {
                            mostrarToastActualizacion('Nueva versión detectada. Actualizando...', 'info');
                            setTimeout(() => {
                                reg.waiting.postMessage({ type: 'SKIP_WAITING' });
                            }, 450);
                        }

                        reg.addEventListener('updatefound', () => {
                            const nuevoSW = reg.installing;
                            if (!nuevoSW) return;

                            nuevoSW.addEventListener('statechange', () => {
                                if (nuevoSW.state === 'installed' && navigator.serviceWorker.controller) {
                                    mostrarToastActualizacion('Hay una nueva versión. Aplicando cambios...', 'info');
                                    setTimeout(() => {
                                        nuevoSW.postMessage({ type: 'SKIP_WAITING' });
                                    }, 450);
                                }
                            });
                        });

                        reg.update();
                    })
                    .catch(err => console.log('Error al registrar SW:', err));

                let recargaHecha = false;
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                    if (recargaHecha) return;
                    recargaHecha = true;
                    mostrarToastActualizacion('Versión actualizada. Recargando...', 'ok');
                    window.location.reload();
                });
            });
        }
    </script>
</body>
    <script>
    // --- AUTENTICACIÓN Y BIENVENIDA NUTRAFIT ---
    const URL_GOOGLE_SCRIPT = "https://script.google.com/macros/s/AKfycbwjfkP0heGq5EUYQMPLK5rEPG2fg8CSVqh4BsblQI8sXqO80adDyRgzA66rd_awByct/exec";
    let usuarioActivo = null;
    let dispositivoId = null;

    function generarDispositivoId() {
        let id = localStorage.getItem('nutrafit_dispositivo_id');
        if (!id) {
            id = 'nutrafit-' + Math.random().toString(36).substr(2, 12) + '-' + Date.now();
            localStorage.setItem('nutrafit_dispositivo_id', id);
        }
        return id;
    }

    function mostrarModalUsuario(modo = 'bienvenida', mensaje = '') {
        const modal = document.getElementById('modal-usuario');
        const titulo = document.getElementById('modal-usuario-titulo');
        const form = document.getElementById('modal-usuario-formulario');
        const msg = document.getElementById('modal-usuario-mensaje');
        modal.classList.remove('oculto');
        msg.textContent = mensaje || '';
        if (modo === 'bienvenida') {
            titulo.textContent = 'Bienvenida a Nutrafit';
            form.style.display = '';
            msg.style.display = 'none';
        } else if (modo === 'pendiente') {
            titulo.textContent = 'Registro pendiente';
            form.style.display = 'none';
            msg.style.display = '';
        } else if (modo === 'no_validado') {
            titulo.textContent = 'Usuario no validado';
            form.style.display = 'none';
            msg.style.display = '';
        } else if (modo === 'otro_dispositivo') {
            titulo.textContent = 'Dispositivo no autorizado';
            form.style.display = 'none';
            msg.style.display = '';
        } else if (modo === 'ok') {
            modal.classList.add('oculto');
        }
    }

    async function registrarUsuario() {
        const correo = document.getElementById('input-correo').value.trim().toLowerCase();
        const nombre = document.getElementById('input-nombre').value.trim();
        if (!correo || !nombre) return mostrarModalUsuario('bienvenida', 'Introduce tu correo y nombre.');
        const dispositivo_id = generarDispositivoId();
        const res = await fetch(URL_GOOGLE_SCRIPT, {
            method: 'POST',
            body: JSON.stringify({ tipo: 'registro_usuario', usuario_id: correo, nombre, dispositivo_id })
        });
        const data = await res.json();
        if (data.status === 'existe') {
            mostrarModalUsuario('bienvenida', 'Ya existe un usuario con ese correo. Pulsa "Ya tengo cuenta".');
        } else if (data.status === 'pendiente') {
            localStorage.setItem('nutrafit_usuario_id', correo);
            mostrarModalUsuario('pendiente', 'Tu registro está pendiente de validación por el administrador. Recibirás un correo cuando puedas acceder.');
        } else {
            mostrarModalUsuario('bienvenida', 'Error inesperado.');
        }
    }

    async function loginUsuario() {
        const correo = document.getElementById('input-correo').value.trim().toLowerCase();
        if (!correo) return mostrarModalUsuario('bienvenida', 'Introduce tu correo.');
        const dispositivo_id = generarDispositivoId();
        const res = await fetch(URL_GOOGLE_SCRIPT, {
            method: 'POST',
            body: JSON.stringify({ tipo: 'login_usuario', usuario_id: correo, dispositivo_id })
        });
        const data = await res.json();
        if (data.status === 'ok') {
            localStorage.setItem('nutrafit_usuario_id', correo);
            mostrarModalUsuario('ok');
            usuarioActivo = correo;
            setTimeout(() => {
                document.getElementById('pantalla-inicio').style.display = 'flex';
            }, 200);
        } else if (data.status === 'no_registrado') {
            mostrarModalUsuario('bienvenida', 'No existe ese usuario. Regístrate primero.');
        } else if (data.status === 'no_validado') {
            mostrarModalUsuario('no_validado', 'Tu usuario aún no ha sido validado por el administrador.');
        } else if (data.status === 'otro_dispositivo') {
            mostrarModalUsuario('otro_dispositivo', 'Este usuario solo puede usarse en el dispositivo donde se registró.');
        } else {
            mostrarModalUsuario('bienvenida', 'Error inesperado.');
        }
    }

    function comprobarSesionUsuario() {
        const correo = localStorage.getItem('nutrafit_usuario_id');
        if (!correo) {
            mostrarModalUsuario('bienvenida');
            document.getElementById('pantalla-inicio').style.display = 'none';
            return;
        }
        loginUsuarioAuto(correo);
    }

    async function loginUsuarioAuto(correo) {
        const dispositivo_id = generarDispositivoId();
        const res = await fetch(URL_GOOGLE_SCRIPT, {
            method: 'POST',
            body: JSON.stringify({ tipo: 'login_usuario', usuario_id: correo, dispositivo_id })
        });
        const data = await res.json();
        if (data.status === 'ok') {
            usuarioActivo = correo;
            document.getElementById('modal-usuario').classList.add('oculto');
            document.getElementById('pantalla-inicio').style.display = 'flex';
        } else if (data.status === 'no_validado') {
            mostrarModalUsuario('no_validado', 'Tu usuario aún no ha sido validado por el administrador.');
            document.getElementById('pantalla-inicio').style.display = 'none';
        } else if (data.status === 'otro_dispositivo') {
            mostrarModalUsuario('otro_dispositivo', 'Este usuario solo puede usarse en el dispositivo donde se registró.');
            document.getElementById('pantalla-inicio').style.display = 'none';
        } else {
            mostrarModalUsuario('bienvenida');
            document.getElementById('pantalla-inicio').style.display = 'none';
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('btn-registrar-usuario').onclick = registrarUsuario;
        document.getElementById('btn-login-usuario').onclick = loginUsuario;
        comprobarSesionUsuario();
    });
    </script>
</html>
